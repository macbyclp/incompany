# =============================================================================
#  iNCompany — Geliştirme Ortamı
#
#  Baslatma:
#    cp .env.example .env
#    docker compose up -d
#    docker compose exec postgres psql -U incompany -d incompany -f /docker-entrypoint-initdb.d/001_schema.sql
#
#  ⚠ BU DOSYA GELİŞTİRME İÇİNDİR. Üretimde neden doğrudan kullanılmaz:
#    · Parolalar ortam değişkeninde (üretimde: Vault / K8s Secret / SOPS)
#    · Veritabanı portları makineye açık (üretimde: yalnızca iç ağ)
#    · Tek replika, yük dengeleyici yok
#    · TLS terminasyonu yok
#    · Kaynak sınırları gevşek
#  Üretim yapılandırması icin: docs/05-dagitim.md
# =============================================================================

name: incompany

services:
  # ---------------------------------------------------------------------------
  #  PostgreSQL — ilişkisel veri + mesaj geçmişi (partitioned)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    container_name: incompany-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incompany
      POSTGRES_USER: incompany
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmali}
      # scram-sha-256: md5'ten belirgin şekilde güçlüdür ve PG16 varsayılanıdır.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      TZ: Europe/Istanbul
    command:
      - postgres
      # Bağlantı havuzu backend'de; DB tarafında yüksek limit gereksiz bellek tüketir.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      # Partition pruning'in çalışması için gereklidir.
      - -c
      - enable_partition_pruning=on
      # Yavaş sorguları logla — 500 ms üstü incelenmelidir.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Şema, ilk açılışta otomatik uygulanır.
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Yalnızca localhost'a bağla — 0.0.0.0 makineyi ağa açar.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incompany -d incompany"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------------------------------------------------------------------------
  #  Redis — presence, pub/sub, rate limit, idempotency, Socket.IO adapter
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: incompany-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD .env dosyasinda tanimlanmali}
      # AOF everysec: en fazla 1 sn'lik veri kaybı. Presence için fazlasıyla
      # yeterli; RDB-only bir yeniden başlatmada tüm sayaçları kaybettirir.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      # allkeys-lru DEĞİL: presence ve idempotency anahtarlarının sessizce
      # atılması veri kaybı gibi görünmeyen hatalara yol açar. volatile-lru
      # yalnızca TTL'i olan anahtarları atar.
      - --maxmemory-policy
      - volatile-lru
      # Anahtar süre dolumu bildirimleri — presence OFFLINE tespiti bunu kullanır.
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  #  MinIO — S3 uyumlu dosya deposu
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: incompany-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-incompany}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD tanimlanmali}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Backend — NestJS API + WebSocket Gateway
  # ---------------------------------------------------------------------------
  backend:
    build:
      # Bağlam DEPO KÖKÜ: `@incompany/contracts` workspace paketi
      # `packages/` altındadır ve derleme sırasında erişilebilir olmalıdır.
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: incompany-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://incompany:${POSTGRES_PASSWORD}@postgres:5432/incompany
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: incompany-files
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-incompany}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # Erişim ve refresh token'ları FARKLI sırlarla imzalanır. Aynı sırrı
      # kullanmak, bir refresh token'ın erişim token'ı olarak kabul
      # edilmesine yol açar (tip karıştırma saldırısı).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?openssl rand -base64 48 ile uretin}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?openssl rand -base64 48 ile uretin}
      JWT_ISSUER: https://incompany.local
      JWT_AUDIENCE: incompany-web

      # ⚠ YALNIZCA GELİŞTİRME. Üretimde AWS KMS veya Vault Transit.
      KMS_PROVIDER: local
      LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?openssl rand -base64 32 ile uretin}

      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./packages:/app/packages:ro
      # node_modules'u konteyner içinde tut — host'taki (Windows/macOS)
      # ikili dosyalar Linux konteynerinde çalışmaz.
      - backend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9229:9229"   # Node inspector
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  Frontend — React + Vite
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: incompany-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./packages:/app/packages:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  default:
    name: incompany-net
    driver: bridge
