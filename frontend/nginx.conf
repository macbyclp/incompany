# =============================================================================
#  iNCompany Frontend — Nginx
#
#  TLS terminasyonu YUKARI KATMANDA (ingress / LB) yapılır. Bu konteyner
#  düz HTTP dinler ve yalnızca statik dosya servis eder.
# =============================================================================

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Nginx sürümünü yanıt başlıklarında gizle — sürüme özgü açık
    # taramasını zorlaştırır.
    server_tokens off;

    # -------------------------------------------------------------------------
    #  Güvenlik başlıkları
    #
    #  Not: CSP burada da tanımlanır. API tarafındaki Helmet yapılandırması
    #  yalnızca API yanıtlarını kapsar; HTML belgesini bu sunucu döndürür ve
    #  tarayıcı CSP'yi BELGE yanıtından okur.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 'unsafe-inline' ve 'unsafe-eval' YOKTUR: bunlar CSP'nin XSS'e karşı
    # sağladığı korumanın büyük kısmını ortadan kaldırır.
    # style-src'de 'unsafe-inline' Tailwind'in çalışma zamanı stilleri için
    # gereklidir ve stil enjeksiyonu betik çalıştırmaya yol açmaz.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/wasm text/xml application/xml image/svg+xml;

    # -------------------------------------------------------------------------
    #  Önbellekleme
    # -------------------------------------------------------------------------

    # Vite, varlık dosya adlarına içerik özeti (hash) ekler. İçerik
    # değiştiğinde ad da değişir; bu yüzden süresiz önbelleklenebilirler.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html ASLA önbelleklenmez. Önbelleklenirse, dağıtımdan sonra
    # kullanıcılar eski HTML'i alır ve o HTML artık var olmayan varlık
    # dosyalarına referans verir — uygulama beyaz ekranla açılır.
    location = /index.html {
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Kaynak haritaları DIŞARIYA SERVİS EDİLMEZ. Hata izleme servisine
    # ayrıca yüklenirler; herkese açık olmaları uygulama iç yapısını ifşa eder.
    location ~ \.map$ {
        return 404;
    }

    # -------------------------------------------------------------------------
    #  SPA yönlendirmesi
    #  İstemci tarafı yönlendirici derin bağlantıları (/channels/abc) yönetir;
    #  Nginx bilinmeyen yolları index.html'e düşürür.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sağlık kontrolü — Kubernetes probe'u için.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gizli dosyalara erişimi engelle (.env, .git vb. yanlışlıkla
    # kopyalanmış olsa bile).
    location ~ /\. {
        deny all;
        return 404;
    }
}
