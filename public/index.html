<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>incompany</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2096%2096'%3E%3Crect%20width='96'%20height='96'%20rx='26'%20fill='%230f766e'/%3E%3Cpath%20fill='%23fff'%20fill-rule='evenodd'%20transform='translate%2848%2049%29%20scale%28.74%29%20translate%28-48%20-50%29'%20d='M26%2014h44a16%2016%200%200%201%2016%2016v26a16%2016%200%200%201-16%2016H52L36%2086V72h-10A16%2016%200%200%201%2010%2056V30A16%2016%200%200%201%2026%2014z%20M43.4%2044.545A8%208%200%201%201%2052.6%2044.545L55%2060H41z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--surface-2:#faf9f7;--ink:#17201e;--ink-2:#4b5a56;--ink-3:#8a9893;
  --line:#e6e3dd;--line-2:#d8d4cc;
  --brand:#0f766e;--brand-ink:#ffffff;--brand-soft:#e1f1ee;--brand-line:#b6dcd5;
  --side:#10201d;--side-ink:#cfe0db;--side-mut:#7f9791;--side-act:#1c3631;
  --ok:#15803d;--ok-bg:#e3f4e8;--warn:#a16207;--warn-bg:#fbf0d3;--bad:#b42318;--bad-bg:#fbe4e1;--idle:#5b6764;--idle-bg:#ecebe7;
  --wa:#1f9d55;--tg:#2481cc;--sl:#c0492b;--em:#7a5c2e;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px -8px rgba(20,32,29,.12);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1311;--surface:#131d1a;--surface-2:#101815;--ink:#e6efec;--ink-2:#a5b6b1;--ink-3:#6f827c;
  --line:#22302c;--line-2:#2d3f3a;
  --brand:#2dd4bf;--brand-ink:#04211d;--brand-soft:#12332e;--brand-line:#1d4f47;
  --side:#08100e;--side-ink:#cfe0db;--side-mut:#6f867f;--side-act:#13241f;
  --ok:#5fd28a;--ok-bg:#12301f;--warn:#e8b947;--warn-bg:#33290f;--bad:#ff8a7e;--bad-bg:#3a1713;--idle:#9bacA6;--idle-bg:#1b2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
a{color:var(--brand)}
.hidden{display:none!important}
.mut{color:var(--ink-3)}.mut2{color:var(--ink-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}

/* kabuk */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:650;font-size:17px;letter-spacing:-.02em;color:#fff}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--side-ink);text-decoration:none;cursor:pointer;font-weight:520}
.nav a svg{width:18px;height:18px;opacity:.75;flex:none}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:var(--side-act);color:#fff}.nav a.active svg{opacity:1;color:var(--brand)}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mut);padding:16px 11px 6px}
.userbox{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:14px 8px 4px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:650;flex:none}
.userbox .who{min-width:0;flex:1}.userbox .who b{display:block;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .who span{font-size:12px;color:var(--side-mut)}
.iconbtn{background:none;border:0;color:var(--side-mut);cursor:pointer;padding:6px;border-radius:8px}.iconbtn:hover{color:#fff;background:rgba(255,255,255,.07)}

main{padding:30px clamp(18px,4vw,44px) 60px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:25px}.head p{margin:4px 0 0;color:var(--ink-2)}

/* ortak bileşenler */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stat .n{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.stat .l{color:var(--ink-2);margin-top:2px}.stat .s{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=email],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
label.f{display:block;margin:0 0 14px}label.f>span{display:block;font-weight:560;margin-bottom:5px}label.f small{display:block;color:var(--ink-3);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:580;background:var(--idle-bg);color:var(--idle)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;padding:1px 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.src{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;color:#fff;flex:none}
.src svg{width:20px;height:20px}
.src.whatsapp{background:var(--wa)}.src.telegram{background:var(--tg)}.src.slack{background:var(--sl)}.src.email{background:var(--em)}
.notice.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.notice.warn svg{color:var(--warn)}
.ctext{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;max-height:170px;overflow:auto}.ctext p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-2)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px;padding:12px 14px;color:var(--ink);margin-bottom:18px}
.notice svg{width:20px;height:20px;color:var(--brand);flex:none;margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}

/* kaynak kartı */
.acc{display:flex;flex-direction:column;gap:12px}
.acc .top{display:flex;gap:12px;align-items:center}.acc .top .t{min-width:0;flex:1}.acc .top b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .scope{display:flex;gap:6px;flex-wrap:wrap}
.acc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* grafik */
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--brand);opacity:.85;min-height:3px;transition:height .4s}
.bars span{font-size:11px;color:var(--ink-3)}
.bars div:hover i{opacity:1}
.meter{height:8px;border-radius:99px;background:var(--idle-bg);overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* liste */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}.item:hover{background:var(--surface-2)}
.item .t{min-width:0;flex:1}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:320px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
mark{background:color-mix(in srgb,var(--brand) 25%,transparent);color:inherit;border-radius:3px;padding:0 2px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line)}

/* modal + çekmece */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(540px,100%);max-height:92vh;overflow:auto;padding:24px}
.modal h2{font-size:19px;margin-bottom:6px}.modal .sub{color:var(--ink-2);margin:0 0 18px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);z-index:50;display:flex;flex-direction:column;animation:slide .2s}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.drawer .db{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.msg{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 13px}
.msg.me{align-self:flex-end;background:var(--brand-soft);border-color:var(--brand-line);border-radius:14px 14px 4px 14px}
.msg .who{font-size:12px;font-weight:650;color:var(--brand)}.msg .tm{font-size:11.5px;color:var(--ink-3);margin-top:3px}.msg .sj{font-weight:650}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;margin-bottom:8px}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{margin-top:4px;accent-color:var(--brand)}.opt b{display:block}.opt span{color:var(--ink-2);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.tile{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line-2);border-radius:13px;cursor:pointer;background:var(--surface)}
.tile:hover{border-color:var(--brand)}.tile b{display:block}.tile span{font-size:12.5px;color:var(--ink-2)}
.qrbox{display:grid;place-items:center;min-height:300px;background:#fff;border-radius:14px;border:1px solid var(--line);margin:8px 0}.qrbox img{width:280px;height:280px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.tokenbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--brand);border-radius:11px;padding:10px 12px;word-break:break-all}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}

/* giriş */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:
  radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--brand) 16%,transparent),transparent),var(--bg)}
.login .card{width:min(430px,100%);padding:32px}
.login .logo{width:46px;height:46px;border-radius:13px;margin-bottom:18px}
.login h1{font-size:24px;margin-bottom:6px}.login p{color:var(--ink-2);margin:0 0 22px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .brand{padding:0 8px}.nav{flex-direction:row;flex-wrap:wrap}.nav .sep{display:none}.nav a span{display:none}
  .userbox{margin:0 0 0 auto;border:0;padding:0}.userbox .who{display:none}
  .g4,.g2{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="card">
    <div class="logo"><svg width="30" height="30" viewBox="8 12 80 76" aria-hidden="true"><path style="fill:var(--brand-ink)" fill-rule="evenodd" d="M26 14h44a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H52L36 86V72h-10A16 16 0 0 1 10 56V30A16 16 0 0 1 26 14z M43.4 44.545A8 8 0 1 1 52.6 44.545L55 60H41z"/></svg></div>
    <h1>incompany</h1>
    <p>Şirket içi zihin sistemi. Devam etmek için yöneticinin verdiği erişim anahtarını gir.</p>
    <label class="f"><span>Erişim anahtarı</span><input id="tok" type="password" autocomplete="off" placeholder="Anahtarını buraya yapıştır"></label>
    <button class="btn primary" id="loginBtn" style="width:100%;justify-content:center">Giriş yap</button>
    <p id="loginErr" class="mut" style="margin:14px 0 0;color:var(--bad)"></p>
  </div>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="8 12 80 76" aria-hidden="true"><path style="fill:var(--brand-ink)" fill-rule="evenodd" d="M26 14h44a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H52L36 86V72h-10A16 16 0 0 1 10 56V30A16 16 0 0 1 26 14z M43.4 44.545A8 8 0 1 1 52.6 44.545L55 60H41z"/></svg></div>incompany</div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox"><div class="avatar" id="av"></div><div class="who"><b id="uname"></b><span id="urole"></span></div>
      <button class="iconbtn" id="logout" title="Çıkış"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, a, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;      // yalnız sabit ikonlar için
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
const ic = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I = {
  home: ic('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'),
  plug: ic('<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/>'),
  chat: ic('<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
  shield: ic('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>'),
  users: ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 20a6 6 0 0 0-3-5.2"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  info: ic('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  wa: ic('<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a3.5 3.5 0 0 1-1.8-1.8l.8-1-1-2z"/>'),
  tg: ic('<path d="M21 4L3 11l6 2 2 6 3-4 5 4 2-15z"/>'),
  sl: ic('<path d="M4 9h16M4 15h16M9 3L7 21M17 3l-2 18"/>'),
  em: ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  user: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  lock: ic('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  log: ic('<path d="M4 6h16M4 12h16M4 18h10"/>'),
  send: ic('<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>'),
};
const SRC = {
  whatsapp: { name: 'WhatsApp', icon: I.wa, desc: 'Kendi hesabını QR ile bağla (WhatsApp Web gibi)' },
  telegram: { name: 'Telegram', icon: I.tg, desc: 'Gruplara eklenen şirket botu' },
  slack: { name: 'Slack', icon: I.sl, desc: 'Kanallara eklenen şirket uygulaması' },
  email: { name: 'E-posta', icon: I.em, desc: 'IMAP kutusu, yalnız rızanla' },
};
const STATUS = {
  connected: ['Bağlı', 'ok'], awaiting_qr: ['QR bekliyor', 'warn'], awaiting_consent: ['Rıza bekliyor', 'warn'],
  reconnecting: ['Yeniden bağlanıyor', 'warn'], logged_out: ['Bağlantı koptu', 'bad'], error: ['Hata', 'bad'],
  revoked: ['Rıza geri çekildi', ''], disabled: ['Devre dışı', ''], new: ['Yeni', '']
};
const fmtDate = (d) => new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(d));
const fmtNum = (n) => new Intl.NumberFormat('tr-TR').format(n);
const initials = (n) => (n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function toast(msg, bad) { const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg); $('#toasts').append(t); setTimeout(() => t.remove(), 3800); }

let TOKEN = ''; try { TOKEN = sessionStorage.getItem('t') || ''; } catch {}
async function api(path, opt = {}) {

  const m = modal(h('div', null, h('h2', null, space.name), h('p', { class: 'sub' }, 'Üyeler bu alana taşınan konuşmaları görür ve arayabilir.'),
    h('div', { class: 'list', style: 'margin-bottom:14px' }, members.map(x => h('div', { class: 'item', style: 'cursor:default' }, h('div', { class: 't' }, h('b', null, x.name), h('span', { class: 'mut' }, x.role === 'admin' ? 'Alan yöneticisi' : 'Üye')),
      h('button', { class: 'btn sm danger', onclick: async () => { await act(() => api(`/spaces/${space.id}/members/${x.user_id}`, { method: 'DELETE' }), 'Üye çıkarıldı'); m.close(); route(); } }, 'Çıkar')))),
    candidates.length ? h('div', { class: 'row' }, h('div', { style: 'flex:1' }, who), role, h('button', { class: 'btn primary', onclick: async () => { await act(() => api(`/spaces/${space.id}/members`, { method: 'POST', body: { userId: Number(who.value), role: role.value } }), 'Üye eklendi'); m.close(); route(); } }, 'Ekle')) : h('div', { class: 'mut' }, 'Eklenecek başka kişi yok.'),

/* ---------- Gizlilik ve KVKK (yönetici) ---------- */
async function download(path, body, filename) {
  const r = await fetch(path, { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('Hata ' + r.status));
  const url = URL.createObjectURL(await r.blob()); const a = h('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
async function privacy(main) {

  // beni kaydetme

  const exPurge = h('input', { type: 'checkbox', checked: true });
  // veri talebi
  const rid = h('input', { type: 'text', placeholder: 'Kişinin telefonu, e-postası ya da kimliği' }), rnote = h('input', { type: 'text', placeholder: 'Başvuru no / not (denetim kaydına yazılır)' });

    h('div', { class: 'notice' }, h('span', { html: I.shield }), h('div', null, h('b', null, 'Yönetici kişisel alanları göremez. '), 'Veri talepleri ortak ve ekip alanlarındaki kayıtları içerir; başkasının kişisel alanındaki eşleşmeler yalnız sayı olarak bildirilir. Silme ise kişisel alanlar dahil her yerde uygulanır.')),
    h('div', { class: 'card', style: 'margin-bottom:14px' }, h('h3', null, '“Beni kaydetme” listesi'),
      h('p', { class: 'mut2' }, 'Listedeki kişinin mesajları hiçbir kaynaktan (WhatsApp, Telegram, Slack, e-posta) kaydedilmez; onunla birebir yazışmalar da kaydedilmez. WhatsApp’ta gizlenmiş (LID) kimlikler telefon numarasıyla eşleşmeyebilir; gerekirse LID’i de ekle.'),
      h('div', { class: 'row' }, h('div', { style: 'flex:2;min-width:240px' }, exId), h('div', { style: 'flex:1;min-width:160px' }, exLabel),
        h('label', { class: 'row', style: 'gap:6px' }, exPurge, 'Geçmişini de sil'),
        h('button', { class: 'btn primary', onclick: async () => { const r = await act(() => api('/exclusions', { method: 'POST', body: { identifier: exId.value.trim(), label: exLabel.value.trim() || undefined, purge: exPurge.checked } }), 'Listeye eklendi'); toast(r.purged ? r.purged + ' eski mesaj silindi' : 'Eski kayıt bulunmadı'); route(); } }, 'Ekle')),
      ex.length ? h('table', { style: 'margin-top:12px' }, h('thead', null, h('tr', null, ['Kimlik', 'Not', 'Eklendi', ''].map(t => h('th', null, t)))),
        h('tbody', null, ex.map(e => h('tr', null, h('td', { class: 'mono' }, e.value), h('td', { class: 'mut2' }, e.label || '—'), h('td', { class: 'mut2' }, fmtDate(e.created_at)),
          h('td', null, h('button', { class: 'btn sm', onclick: async () => { await act(() => api('/exclusions/' + e.id, { method: 'DELETE' }), 'Listeden çıkarıldı'); route(); } }, 'Çıkar')))))) : h('div', { class: 'mut', style: 'margin-top:10px' }, 'Listede kimse yok.')),
    h('div', { class: 'card', style: 'margin-bottom:14px' }, h('h3', null, 'Veri talebi (KVKK m.11)'),
      h('p', { class: 'mut2' }, 'Bir kişi hakkında tutulan mesajları dışa aktar ya da sil. Kimlik olarak telefon numarası (biçimi önemli değil), e-posta ya da kaynaktaki kullanıcı kimliği yazılır.'),
      h('div', { class: 'row' }, h('div', { style: 'flex:2;min-width:240px' }, rid), h('div', { style: 'flex:1;min-width:200px' }, rnote)),
      h('div', { class: 'row', style: 'margin-top:12px' },
        h('button', { class: 'btn', onclick: async () => { const r = await act(() => api('/data-requests/export', { method: 'POST', body: { identifier: rid.value.trim(), note: rnote.value.trim() || undefined } })); const u = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' })); const a = h('a', { href: u, download: slug() + '-' + r.subject_ref + '.json' }); document.body.append(a); a.click(); a.remove(); toast(r.messages.length + ' mesaj dışa aktarıldı' + (r.hidden_by_access ? '; erişim dışı ' + r.hidden_by_access + ' kayıt var' : '')); } }, 'JSON indir'),
        h('button', { class: 'btn', onclick: () => act(() => download('/data-requests/export', { identifier: rid.value.trim(), note: rnote.value.trim() || undefined, format: 'csv' }, slug() + '.csv'), 'CSV indirildi') }, 'CSV indir'),
        h('button', { class: 'btn danger', onclick: () => eraseModal(rid.value.trim(), rnote.value.trim()) }, 'Sil…'))),
    h('div', { class: 'grid g2' },

        h('p', { class: 'mut2' }, 'Telegram ve Slack’ten gelen mesajlar için varsayılan süre. WhatsApp ve e-posta için süreyi her kişi rıza kapsamında seçer. Süresi dolanlar günlük bir işle silinir.'),
        h('div', { class: 'row' }, h('div', { style: 'width:160px' }, days), h('span', { class: 'mut' }, 'gün'),

      h('div', { class: 'card' }, h('h3', null, 'Aydınlatma metni · sürüm ' + ct.version),
        h('p', { class: 'mut2' }, 'Bu metin rıza ekranında gösterilir. Metni değiştirirsen sürüm artar ve kişisel kaynaklar herkes yeniden onaylayana kadar durur. Yayınlamadan önce bir hukuk uzmanına göstermen önerilir.'),
        text, h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn primary', onclick: async () => {

        } }, 'Yeni sürüm yayınla')))));
}
function eraseModal(identifier, note) {
  if (identifier.length < 3) return toast('Önce kişinin kimliğini yaz', true);
  let exclude = true;
  const m = modal(h('div', null, h('h2', null, 'Kişinin verilerini sil'), h('p', { class: 'sub' }, `“${identifier}” kimliğine ait tüm mesajlar ve bu kişiyle yapılan birebir sohbetler, kişisel alanlar dahil her yerden kalıcı olarak silinir. Bu geri alınamaz.`),
    h('label', { class: 'opt' }, h('input', { type: 'checkbox', checked: true, onchange: (e) => exclude = e.target.checked }), h('div', null, h('b', null, 'Bir daha kaydetme'), h('span', null, 'Kişi “beni kaydetme” listesine de eklenir.'))),
    h('div', { class: 'foot' }, h('button', { class: 'btn', onclick: () => m.close() }, 'Vazgeç'),
      h('button', { class: 'btn danger', onclick: async () => { const r = await act(() => api('/data-requests/erase', { method: 'POST', body: { identifier, exclude, note: note || undefined } })); m.close(); toast(r.messages + ' mesaj, ' + r.conversations + ' birebir sohbet silindi'); route(); } }, 'Kalıcı olarak sil'))));
}

const AUDIT = {
  'user.create': 'Kullanıcı eklendi', 'user.offboard': 'Çalışan ayrıldı', 'token.reset': 'Anahtar yenilendi', 'token.rotate': 'Kendi anahtarını yeniledi',
  'token.revoke': 'Anahtar iptal edildi', 'account.create': 'Kaynak eklendi', 'account.delete': 'Kaynak kaldırıldı', 'space.create': 'Ekip alanı kuruldu',
  'space.member_add': 'Alana üye eklendi', 'space.member_remove': 'Alandan üye çıkarıldı', 'exclusion.add': 'Kişi hariç tutuldu', 'exclusion.remove': 'Hariç tutma kaldırıldı',
  'data.export': 'Veri talebi: dışa aktarma', 'data.erase': 'Veri talebi: silme', 'settings.consent_text': 'Aydınlatma metni güncellendi',
  'settings.retention': 'Saklama süresi değişti', 'retention.purge': 'Süresi dolan mesajlar silindi', 'secrets.rotate': 'Anahtar rotasyonu',
};
async function auditView(main) {
  let rows = await api('/audit?limit=100'), done = rows.length < 100;
  const body = h('tbody'); const more = h('button', { class: 'btn', style: 'margin:12px auto 0;display:flex', onclick: async () => {
    const next = await act(() => api('/audit?limit=100&before=' + rows[rows.length - 1].id)); rows = rows.concat(next); body.append(...next.map(row)); if (next.length < 100) more.classList.add('hidden'); } }, 'Daha eski kayıtlar');
  const det = (d) => d ? Object.entries(d).filter(([, v]) => v !== null && v !== false && v !== '').map(([k, v]) => k + ': ' + v).join(', ') : '';
  const row = (l) => h('tr', null, h('td', { class: 'mut2', style: 'white-space:nowrap' }, fmtDate(l.at)), h('td', null, l.actor_name || 'Sistem'),
    h('td', null, AUDIT[l.action] || l.action), h('td', { class: 'mut2' }, [l.target_type ? l.target_type + (l.target_id ? ' #' + l.target_id : '') : '', det(l.detail)].filter(Boolean).join(' · ')));
  body.append(...rows.map(row)); if (done) more.classList.add('hidden');
  main.replaceChildren(page('Denetim kaydı', 'Yönetici işlemlerinin silinmeyen izi: kim, neyi, ne zaman yaptı. Mesaj içeriği ve kimlik bilgisi bu kayda yazılmaz.'),
    ...(rows.length ? [h('div', { class: 'card', style: 'overflow:auto' }, h('table', null, h('thead', null, h('tr', null, ['Zaman', 'Kim', 'İşlem', 'Ayrıntı'].map(t => h('th', null, t)))), body)), more]
      : [h('div', { class: 'card empty' }, h('b', null, 'Henüz kayıt yok'), 'Yönetici bir işlem yaptığında burada görünür.')]));
}

/* ---------- başlangıç ---------- */
async function boot() {
  try { ME = await api('/me'); } catch { TOKEN = ''; try { sessionStorage.removeItem('t'); } catch {} $('#shell').classList.add('hidden'); $('#login').classList.remove('hidden'); return; }
  try { SPACES = await api('/spaces'); } catch {}
  $('#login').classList.add('hidden'); $('#shell').classList.remove('hidden');
  $('#av').textContent = initials(ME.name); $('#uname').textContent = ME.name; $('#urole').textContent = ME.is_admin ? 'Yönetici' : 'Üye'; route();
}
$('#loginBtn').onclick = async () => {
  TOKEN = $('#tok').value.trim(); $('#loginErr').textContent = '';
  try { await api('/me'); try { sessionStorage.setItem('t', TOKEN); } catch {} boot(); } catch (e) { $('#loginErr').textContent = /deneme/.test(e.message) ? e.message : 'Anahtar geçersiz.'; }
};
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#logout').onclick = () => { try { sessionStorage.removeItem('t'); } catch {} TOKEN = ''; location.hash = ''; boot(); };
boot();
</script>
