# =============================================================================
#  iNCompany — Sürekli Entegrasyon
#
#  TASARIM İLKESİ: GÜVENLİK KAPILARI BLOKLAYICIDIR.
#    Sır taraması, bağımlılık denetimi ve kritik modül test kapsamı
#    başarısız olduğunda derleme DURUR. "Uyarı olarak geçelim, sonra
#    bakarız" yaklaşımı, o uyarıların hiç okunmamasıyla sonuçlanır.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# En düşük yetki. Varsayılan GITHUB_TOKEN izinleri gereğinden geniştir;
# ele geçirilmiş bir Action bu yetkileri kullanır.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Yeni bir push geldiğinde eski derlemeyi iptal et — main hariç.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20.17'

jobs:
  # ---------------------------------------------------------------------------
  #  1. Sır taraması — HER ŞEYDEN ÖNCE
  #
  #  Sır sızıntısı tespit edilirse diğer işleri çalıştırmanın anlamı yoktur;
  #  yapılacak iş sırrı döndürmek (rotate) ve geçmişi temizlemektir.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Sır taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tüm geçmiş: bir sır önceki bir commit'te eklenmiş olabilir.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  #  2. Backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — lint, tip, test
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Workspace kökündeki TEK lock dosyası tüm paketleri kapsar.
          cache-dependency-path: package-lock.json

      # `--ignore-scripts`: postinstall betikleri, bir bağımlılığın CI
      # ortamınızda keyfi kod çalıştırmasına açık kapıdır.
      # Kökten çalıştırılır: tüm workspace'ler tek seferde kurulur.
      - name: Bağımlılıklar
        run: npm ci --ignore-scripts

      # Paylaşılan sözleşme ÖNCE derlenir. Backend ona node_modules
      # sembolik bağı üzerinden erişir; derlenmemişse tip kontrolü
      # "Cannot find module" ile düşer.
      - name: Sözleşmeyi derle
        run: npm run build --workspace @incompany/contracts

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Tip kontrolü
        working-directory: backend
        run: npm run typecheck

      # Kapsam eşikleri vitest.config.ts'te tanımlıdır. Güvenlik kritik
      # modüller (crypto, DLP, sanitize, guards) %90-100 eşiğe tabidir.
      - name: Testler ve kapsam
        working-directory: backend
        run: npm run test:cov

      - name: Kapsam raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  #  3. Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, tip, derleme
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıklar
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tip kontrolü
        working-directory: frontend
        run: npm run typecheck

      - name: Testler
        working-directory: frontend
        run: npm test

      # Derleme, paylaşılan sözleşmenin (`packages/contracts`) her iki
      # tarafta da tutarlı olduğunu doğrular: backend'de bir event
      # değiştiyse frontend derlemesi burada kırılır.
      - name: Derleme
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  #  4. Veritabanı şeması
  #
  #  Şema gerçek bir PostgreSQL'e uygulanır. Bir DDL hatası (geçersiz
  #  kısıt, eksik uzantı, hatalı tetikleyici) burada yakalanır — üretim
  #  migrasyonu sırasında değil.
  # ---------------------------------------------------------------------------
  schema:
    name: Veritabanı şeması
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: incompany_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # `ON_ERROR_STOP=1` kritiktir: olmadan psql hataları yutar ve
      # yarım uygulanmış bir şema "başarılı" görünür.
      - name: Şemayı uygula
        env:
          PGPASSWORD: ci_test_only
        run: |
          psql -h localhost -U postgres -d incompany_test \
               -v ON_ERROR_STOP=1 -f db/postgres/001_schema.sql

      - name: Şema bütünlüğü doğrulaması
        env:
          PGPASSWORD: ci_test_only
        run: |
          # Beklenen tabloların varlığını doğrula.
          psql -h localhost -U postgres -d incompany_test -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              expected text[] := ARRAY['organizations','departments','users','roles',
                                       'channels','channel_members','messages',
                                       'audit_logs','attachments','dlp_rules',
                                       'refresh_sessions','outbox_events'];
              missing text[];
            BEGIN
              SELECT array_agg(t) INTO missing
                FROM unnest(expected) t
               WHERE NOT EXISTS (
                 SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = t
               );
              IF missing IS NOT NULL THEN
                RAISE EXCEPTION 'Eksik tablolar: %', missing;
              END IF;
            END \$\$;"

          # Denetim tablosunun gerçekten ekle-yalnız olduğunu doğrula:
          # bu, uyumun dayandığı garantidir ve test edilmelidir.
          psql -h localhost -U postgres -d incompany_test -c "
            DO \$\$
            BEGIN
              BEGIN
                UPDATE audit_logs SET action = 'kurcalandi';
                RAISE EXCEPTION 'HATA: audit_logs UPDATE kabul etti — ekle-yalniz korumasi calismyor';
              EXCEPTION WHEN insufficient_privilege THEN
                RAISE NOTICE 'Ekle-yalniz korumasi dogrulandi';
              END;
            END \$\$;"

  # ---------------------------------------------------------------------------
  #  5. Bağımlılık ve konteyner güvenliği
  # ---------------------------------------------------------------------------
  security:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # HIGH ve üzeri bulgu derlemeyi durdurur. Eşiği düşürmek,
      # kritik açıklarla üretime çıkmak demektir.
      # Kökten çalıştırılır: tek lock dosyası tüm workspace'leri kapsar,
      # bu yüzden iki ayrı denetime gerek yoktur.
      - name: Bağımlılık denetimi
        run: npm audit --audit-level=high

      - name: Dosya sistemi taraması (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Sonuçları GitHub Security'ye yükle
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  #  6. Konteyner imajları — SBOM ile
  # ---------------------------------------------------------------------------
  containers:
    name: Konteyner derlemesi
    runs-on: ubuntu-latest
    needs: [backend, frontend, schema, security]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Bağlam DEPO KÖKÜ: `@incompany/contracts` workspace paketi
      # `packages/` altındadır ve derleme sırasında erişilebilir olmalıdır.
      - name: Backend imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          tags: incompany-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM ve provenance: yeni bir CVE çıktığında "etkilendik mi?"
          # sorusu dakikalar içinde yanıtlanabilir hale gelir.
          sbom: true
          provenance: true

      - name: Frontend imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          push: false
          tags: incompany-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: İmaj taraması — backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: incompany-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
